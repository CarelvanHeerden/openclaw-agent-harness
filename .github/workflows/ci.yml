name: CI

on:
  push:
    # `harness/**` is the branch prefix every release actually uses; without it
    # pushes ran no CI at all and the first signal was the PR.
    branches: [main, "feat/**", "fix/**", "harness/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_build_from_source: "true"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Copy schema.sql into dist
        run: mkdir -p dist/state && cp src/state/schema.sql dist/state/

      - name: Verify committed dist/ matches source
        # OpenClaw's `plugins install git:` runs `npm install --omit=dev`,
        # which strips typescript. dist/ must be committed for git installs
        # to work. This step fails CI if a PR modifies src/ without
        # committing the corresponding dist/ rebuild.
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo '::error::dist/ is out of sync with src/. Run `npm run build` and commit dist/.'
            git status --porcelain dist/
            git --no-pager diff --stat dist/
            exit 1
          fi

      - name: Test
        run: node --test tests/*.mjs

      - name: Mutation check (are the safety tests vacuous?)
        # Breaks each b101/b102 safety mechanism in the BUILT output and requires
        # the tests to fail. A green suite proves nothing if it would stay green
        # with the behaviour removed -- which is how the b100 defect survived
        # review in the first place. Restores dist/ itself; the dist-sync step
        # above has already run, so a leaked edit cannot mask a real drift.
        #
        # beta.131: capped. The b130 release hung here for 90 minutes against a
        # ~19-minute run, because a mutation nudged a scenario onto the new
        # time-extension ask and every one of them then waited out the full
        # 300-second operator poll. That is fixed at the source, but an
        # uncapped job means the NEXT hang is also discovered by a human
        # noticing an hour later. 45 gives the real run better than double its
        # headroom.
        timeout-minutes: 45
        run: node scripts/mutation-check.mjs

      - name: Smoke
        # Use a Node ESM loader hook to stub `openclaw/plugin-sdk/plugin-entry`
        # since the real package only exists inside the OpenClaw runtime, not
        # on npm. The stub returns the descriptor object unchanged, letting
        # smoke.mjs exercise register().
        run: node --import ./scripts/register-smoke-loader.mjs scripts/smoke.mjs
