name: CI

on:
  push:
    # `harness/**` is the branch prefix every release actually uses; without it
    # pushes ran no CI at all and the first signal was the PR.
    branches: [main, "feat/**", "fix/**", "harness/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: build-and-test (node ${{ matrix.node-version }})
    strategy:
      # Do not cancel the floor run because the primary failed, or vice versa.
      # Which of the two broke is the whole diagnostic.
      fail-fast: false
      matrix:
        # rc.4: `engines` claimed >=22.5.0 and CI only ever ran 24, so the floor
        # was advertised and never executed. Running it found two things.
        #
        # The floor was not merely untested, it was WRONG: `node:sqlite` is the
        # entire persistence layer and does not exist unflagged before 22.13.0
        # (added experimental in 22.5.0, unflagged in 22.13.0). On 22.5.0 the
        # plugin cannot open its state store at all -- 70 tests failed with "No
        # such built-in module: node:sqlite". The floor is now 22.13.0, which is
        # the first version this code can actually run on.
        #
        # And 22 subtests across the two first-token watchdog files were
        # silently `cancelledByParent` on 22.x, asserting nothing, on the suite
        # that exists because of the beta.63 hung-stream incident. A
        # cancellation is not a failure, so the run stayed green proving nothing.
        #
        # If this matrix is ever cut back to one version, raise `engines` to
        # match what is actually tested. Claiming a floor nobody runs is how
        # both of these survived.
        node-version: ["22.13", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_build_from_source: "true"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Copy schema.sql into dist
        run: mkdir -p dist/state && cp src/state/schema.sql dist/state/

      - name: Verify committed dist/ matches source
        # OpenClaw's `plugins install git:` runs `npm install --omit=dev`,
        # which strips typescript. dist/ must be committed for git installs
        # to work. This step fails CI if a PR modifies src/ without
        # committing the corresponding dist/ rebuild.
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo '::error::dist/ is out of sync with src/. Run `npm run build` and commit dist/.'
            git status --porcelain dist/
            git --no-pager diff --stat dist/
            exit 1
          fi

      - name: Test
        run: node --test tests/*.mjs

      - name: Pack the tested release artifact
        if: matrix.node-version == '24'
        id: package
        run: |
          mkdir -p "$RUNNER_TEMP/oah-package"
          filename="$(npm pack --silent --pack-destination "$RUNNER_TEMP/oah-package")"
          artifact="$RUNNER_TEMP/oah-package/$filename"
          shasum -a 256 "$artifact" | tee "$artifact.sha256"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"
          echo "sha_path=$artifact.sha256" >> "$GITHUB_OUTPUT"

      - name: Install and compare the exact packed artifact
        if: matrix.node-version == '24'
        run: |
          install_root="$RUNNER_TEMP/oah-install"
          mkdir -p "$install_root"
          cd "$install_root"
          npm init -y >/dev/null
          npm install --ignore-scripts --omit=dev "${{ steps.package.outputs.path }}"
          node "$GITHUB_WORKSPACE/scripts/verify-installed-artifact.mjs" \
            "$GITHUB_WORKSPACE" \
            "$install_root/node_modules/openclaw-agent-harness"

      - name: Upload the exact tested package
        if: matrix.node-version == '24'
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-agent-harness-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.path }}
            ${{ steps.package.outputs.sha_path }}
          if-no-files-found: error

      - name: Mutation check (are the safety tests vacuous?)
        # Breaks each b101/b102 safety mechanism in the BUILT output and requires
        # the tests to fail. A green suite proves nothing if it would stay green
        # with the behaviour removed -- which is how the b100 defect survived
        # review in the first place. Restores dist/ itself; the dist-sync step
        # above has already run, so a leaked edit cannot mask a real drift.
        #
        # beta.131: capped. The b130 release hung here for 90 minutes against a
        # ~19-minute run, because a mutation nudged a scenario onto the new
        # time-extension ask and every one of them then waited out the full
        # 300-second operator poll. That is fixed at the source, but an
        # uncapped job means the NEXT hang is also discovered by a human
        # noticing an hour later. 45 gives the real run better than double its
        # headroom.
        #
        # rc.4: primary version only. This asks whether the tests are vacuous,
        # which is a property of the tests and not of the runtime, so paying for
        # it on every matrix leg buys a duplicate answer for ~13 minutes.
        #
        # rc.8: and not on a branch push. The `fix/**` push trigger above means
        # one release asks this question three times about the same code --
        # branch push, PR, merge -- for ~51 minutes of runner time and one
        # answer. The PR is the gate and the main run still covers a direct
        # push, so those two are kept. A branch push keeps install, typecheck,
        # build, the dist-sync check, the suite and smoke, which is the fast
        # pre-PR signal that trigger exists for; it just stops paying 17
        # minutes for an answer the PR is about to give again.
        #
        # This step is ~17 of the job's ~18.5 minutes and grows ~2.8s per
        # mutation, so it is the only step where any of this matters.
        if: >-
          matrix.node-version == '24' &&
          (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        timeout-minutes: 45
        run: node scripts/mutation-check.mjs

      - name: Provenance mutation check (branch push)
        # Branch pushes intentionally skip the full ~17-minute mutation suite,
        # but authenticated approval is too load-bearing to wait for a PR run.
        # Keep this focused gate on the exact pushed commit; PR/main still run
        # the complete mutation set above.
        if: >-
          matrix.node-version == '24' &&
          github.event_name == 'push' &&
          github.ref != 'refs/heads/main'
        run: node scripts/mutation-check.mjs 'rc.13 human provenance:'

      - name: Smoke
        # Use a Node ESM loader hook to stub `openclaw/plugin-sdk/plugin-entry`
        # since the real package only exists inside the OpenClaw runtime, not
        # on npm. The stub returns the descriptor object unchanged, letting
        # smoke.mjs exercise register().
        run: node --import ./scripts/register-smoke-loader.mjs scripts/smoke.mjs
