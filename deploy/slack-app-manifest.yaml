# Optional Slack app manifest for outbound control-plane notifications.
#
# Ordinary users describe changes to OpenClaw; this app carries ordinary
# conversation and lifecycle notifications. Preserve the existing OpenClaw
# Slack routing and authorization configuration when applying this optional
# manifest.

display_information:
  name: OpenClaw Agent Harness
  description: Conversation and lifecycle notifications for repository changes.
  background_color: "#0f172a"
  long_description: |
    Carries OpenClaw conversation and lifecycle notifications for changes
    prepared, confirmed, executed, reviewed, and published.

features:
  bot_user:
    display_name: OpenClaw Agent Harness
    always_online: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
    user: []

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
