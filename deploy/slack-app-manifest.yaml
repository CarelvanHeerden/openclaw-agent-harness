# Optional Slack app manifest for outbound control-plane notifications.
#
# Ordinary users drive the product through four host-authenticated control-plane
# tools. Install this app only when the host should post lifecycle messages into
# Slack.

display_information:
  name: OpenClaw Agent Harness
  description: Outbound notifications for confirmed repository changes.
  background_color: "#0f172a"
  long_description: |
    Posts concise lifecycle notifications for changes prepared, confirmed,
    executed, reviewed, and published through the OpenClaw control plane.

features:
  bot_user:
    display_name: OpenClaw Agent Harness
    always_online: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
    user: []

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
