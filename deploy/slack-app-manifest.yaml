# Optional Slack app manifest for outbound control-plane notifications.
#
# The v2 harness has no Slack listener, dispatcher, slash command, interactive
# callback, or reaction control protocol. Ordinary users drive it exclusively
# through the four host-authenticated control-plane tools. Install this app only
# when the host should post lifecycle messages into Slack.

display_information:
  name: OpenClaw Agent Harness
  description: Outbound notifications for confirmed repository changes.
  background_color: "#0f172a"
  long_description: |
    Posts concise lifecycle notifications for changes prepared, confirmed,
    executed, reviewed, and published through the OpenClaw control plane.
    The app never starts work from Slack messages or emoji reactions.

features:
  bot_user:
    display_name: OpenClaw Agent Harness
    always_online: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
    user: []

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
