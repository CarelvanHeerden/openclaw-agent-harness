# Optional Slack app manifest for outbound control-plane notifications.
#
# Ordinary users describe changes to OpenClaw; this app posts structured
# proposals and receives host-native approval button interactions. Preserve the
# existing OpenClaw Slack routing and authorization configuration when applying
# this optional manifest.

display_information:
  name: OpenClaw Agent Harness
  description: Structured approval and lifecycle notifications for repository changes.
  background_color: "#0f172a"
  long_description: |
    Posts structured proposals and lifecycle notifications for changes prepared,
    approved, executed, reviewed, and published through the OpenClaw control plane.

features:
  bot_user:
    display_name: OpenClaw Agent Harness
    always_online: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
    user: []

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
